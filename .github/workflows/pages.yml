name: Publish OSCE Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and assemble 40 official OSCE daily reports
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-analysis.txt'
      - name: Install extraction and geospatial dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Download official OSCE reports 1–40/2022 and check completeness
        run: python scripts/import_osce_2022.py --cache-dir "${{ runner.temp }}/osce-pdfs"
      - name: Rebuild mapped event data and analyze daily totals
        run: |
          python build_data.py
          python scripts/analyze_osce_2022.py
      - name: Save source audit and aggregate results for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osce-2022-audit
          path: |
            source/osce_reports_2022_index.json
            source/osce_2022_official_rows.json
            source/observer_reference_points_2022.json
            dist/data/analysis.json
            dist/data/daily.csv
            dist/data/observer_locations.csv
            dist/data/unmapped_patrols.csv
            dist/data/provenance.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve downloaded official annex PDFs for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osce-2022-original-pdfs
          path: ${{ runner.temp }}/osce-pdfs/*.pdf
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish validated atlas to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
